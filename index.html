<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラ・サール学園バザー - 事前注文サイト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* モーダルの下部せり上がりアニメーション */
    .slide-up {
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
    }
    .slide-up.active {
      transform: translateY(0);
    }

    /* ローディング用オーバーレイ & スピナー */
    .loading-overlay {
      display: flex;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #ffffff;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-28 min-h-screen">

  <!-- ★ 全面ローディング画面 ★ -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p id="loadingText" class="mt-4 font-bold text-base tracking-wider text-slate-100">情報読み込み中...</p>
  </div>

  <!-- ★ 店員（実行委員）用クイックナビバー ★ -->
  <div id="staffQuickBar" class="hidden bg-slate-800 text-amber-300 px-4 py-2 text-xs font-bold flex justify-between items-center shadow-md">
    <span>【実行委員権限】レジモードが利用可能です</span>
    <a href="admin.html" class="bg-amber-400 hover:bg-amber-500 text-slate-900 px-3 py-1 rounded font-black transition-colors">
      POSレジ画面を開く ➔
    </a>
  </div>

  <!-- ヘッダー -->
  <header class="bg-red-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold tracking-wide">ラ・サール学園バザー</h1>
        <p id="userInfoText" class="text-xs text-red-100">読み込み中...</p>
      </div>
      <button onclick="changeEmail()" class="text-xs bg-red-800 hover:bg-red-900 text-white px-2.5 py-1.5 rounded border border-red-400 shadow-sm">
        メール変更
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-2xl mx-auto px-3 pt-3">
    <!-- お知らせバナー -->
    <div class="bg-amber-50 border-l-4 border-amber-500 p-2.5 mb-3 rounded text-xs text-amber-800 shadow-sm">
      <span class="font-bold">【注文手順】</span> 商品を選択 ➔ カート確認 ➔ 発行されたQRコードをスクショ保存して当日レジへ！
    </div>

    <!-- 縦長トレーディングカード風 2列グリッド表示 -->
    <div id="productGrid" class="grid grid-cols-2 gap-3"></div>
  </main>

  <!-- カート固定フッター -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-2xl z-20">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <span class="text-xs text-slate-400 font-bold">合計金額</span>
        <div class="text-xl font-black text-red-600">¥<span id="totalAmount">0</span></div>
      </div>
      <button id="submitOrderBtn" onclick="openConfirmModal()" disabled
        class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2.5 rounded-xl disabled:bg-slate-300 transition-colors shadow">
        注文内容を確認する
      </button>
    </div>
  </div>

  <!-- 下部からせり上がる注文確認モーダル -->
  <div id="modalBackdrop" class="fixed inset-0 bg-black/60 hidden z-40 transition-opacity"></div>
  
  <div id="confirmModal" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-2xl max-w-2xl mx-auto z-50 p-5 space-y-4 shadow-2xl slide-up">
    <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto -mt-2 mb-1"></div>
    <h3 class="text-lg font-bold border-b pb-2 text-slate-800">注文内容の確認</h3>
    
    <div id="confirmDetailList" class="space-y-2 text-sm max-h-60 overflow-y-auto pr-1"></div>
    
    <div class="border-t pt-2 flex justify-between font-black text-lg">
      <span>お支払い合計</span>
      <span class="text-red-600">¥<span id="confirmTotalAmount">0</span></span>
    </div>
    
    <div class="flex gap-2 pt-2">
      <button onclick="closeConfirmModal()" class="w-1/2 py-3 border rounded-xl text-slate-600 font-bold bg-slate-50">戻る</button>
      <button id="finalSubmitBtn" onclick="executeSubmitOrder()" class="w-1/2 py-3 bg-red-600 text-white rounded-xl font-bold shadow">注文を確定する</button>
    </div>
  </div>

  <!-- 注文完了モーダル (QR表示) -->
  <div id="successModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
      <div class="inline-block p-3 bg-green-100 rounded-full text-green-600 font-bold text-3xl">✓</div>
      <h3 class="text-xl font-bold text-slate-800">ご注文が完了しました！</h3>
      <p class="text-xs text-slate-500">ご指定のメールアドレスへ確認メールを送信しました。<br>この画面をスクリーンショットして当日POSレジへお持ちください。</p>
      
      <div class="bg-slate-50 p-4 rounded-xl border space-y-2">
        <div class="text-xs text-slate-400 font-bold">お客様注文ID (USR)</div>
        <div id="resUserOrderId" class="text-2xl font-black tracking-widest text-red-600">USR00000</div>
        <div id="qrcode" class="flex justify-center py-2"></div>
      </div>

      <button onclick="closeSuccessModal()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">
        閉じる
      </button>
    </div>
  </div>

  <script>
    // ★ WebアプリURLを貼り付けてください ★
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxg_da7psIhzpbH0IHeJSS_iwyjOHxaqw0HxKyYxUJdsHyY8Hr8TuHJudTBne_AhyqQ/exec';

    let state = {
      email: localStorage.getItem('bazaar_email') || '',
      products: [],
      pastQuantities: {},
      cart: {},
      userOrderId: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (!state.email) {
        state.email = prompt('メールアドレスを入力してください:', 'student@lasalle.ed.jp') || 'guest@example.com';
        localStorage.setItem('bazaar_email', state.email);
      }
      initContext();
      setInterval(fetchLatestProducts, 15000); // 15秒ごとにバックグラウンド更新
    });

    function showLoading(msg = '情報読み込み中...') {
      document.getElementById('loadingText').innerText = msg;
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function changeEmail() {
      const input = prompt('メールアドレスを入力してください:', state.email);
      if (input) {
        state.email = input.trim().toLowerCase();
        localStorage.setItem('bazaar_email', state.email);
        state.cart = {};
        initContext();
      }
    }

    async function apiPost(action, payload = {}) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, email: state.email, ...payload })
        });
        return await response.json();
      } catch (err) {
        return { success: false, error: '通信エラーが発生しました。' };
      }
    }

    async function initContext() {
      showLoading('商品・ユーザー情報を読み込み中...');
      document.getElementById('userInfoText').innerText = 'データ取得中...';
      const res = await apiPost('initContext');
      hideLoading();

      if (res.success) {
        state.products = res.products;
        state.pastQuantities = res.pastQuantities;
        state.userOrderId = res.userOrderId;
        document.getElementById('userInfoText').innerText = res.user.detailText;

        if (res.isStaff) {
          document.getElementById('staffQuickBar').classList.remove('hidden');
        } else {
          document.getElementById('staffQuickBar').classList.add('hidden');
        }

        renderProducts();
      }
    }

    async function fetchLatestProducts() {
      const res = await apiPost('fetchProducts');
      if (res.success) {
        state.products = res.products;
        state.pastQuantities = res.pastQuantities;
        renderProducts();
      }
    }

    // 縦長トレーディングカード風UI描画
    function renderProducts() {
      const container = document.getElementById('productGrid');
      container.innerHTML = '';

      state.products.forEach(p => {
        const pastQty = state.pastQuantities[p.id] || 0;
        const currentInCart = state.cart[p.id] || 0;
        const remainingLimit = Math.max(0, p.maxPerUser - pastQty);
        const maxCanAdd = Math.min(p.stock, remainingLimit);

        const isSoldOut = p.stock <= 0;
        const isLowStock = !isSoldOut && p.stock <= p.alertThreshold;
        const isLimitReached = (currentInCart + pastQty) >= p.maxPerUser;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow border overflow-hidden flex flex-col justify-between relative';

        const imgOverlay = isSoldOut 
          ? `<div class="absolute inset-0 bg-black/60 flex items-center justify-center z-10">
               <span class="bg-red-600 text-white font-black text-sm px-3 py-1 rounded shadow transform -rotate-12">SOLD OUT</span>
             </div>`
          : (isLowStock ? `<div class="absolute top-2 left-2 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow z-10">在庫残り僅か</div>` : '');

        // 縦長デザイン用に画像高さを h-48 に設定
        const imgHtml = p.imageUrl
          ? `<img src="${p.imageUrl}" class="w-full h-48 object-cover ${isSoldOut ? 'filter grayscale' : ''}">`
          : `<div class="w-full h-48 bg-slate-100 flex items-center justify-center text-slate-400 text-xs font-bold ${isSoldOut ? 'filter grayscale' : ''}">No Image</div>`;

        // すでに購入済みの件数バッジ
        const pastQtyBadge = pastQty > 0 
          ? `<div class="inline-block bg-blue-50 text-blue-700 text-[10px] font-bold px-1.5 py-0.5 rounded border border-blue-200 mb-1">すでに${pastQty}個注文済み</div>`
          : '';

        card.innerHTML = `
          <div class="relative">
            ${imgOverlay}
            ${imgHtml}
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>
              ${pastQtyBadge}
              <h2 class="font-bold text-slate-800 text-sm leading-snug line-clamp-2">${p.name}</h2>
              <div class="text-red-600 font-black text-base mt-1">¥${p.price.toLocaleString()}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">上限: 1人${p.maxPerUser}個まで</div>
            </div>

            <!-- カート加減算操作 -->
            <div class="flex items-center justify-between border-t pt-2 mt-2">
              <button onclick="updateCart('${p.id}', -1)" ${currentInCart <= 0 ? 'disabled' : ''} 
                class="w-8 h-8 rounded-lg border bg-slate-50 font-bold text-slate-600 disabled:opacity-30 flex items-center justify-center">-</button>
              <span class="font-bold text-sm text-slate-800">${currentInCart}</span>
              <button onclick="updateCart('${p.id}', 1)" ${currentInCart >= maxCanAdd || isSoldOut || isLimitReached ? 'disabled' : ''} 
                class="w-8 h-8 rounded-lg border bg-red-50 font-bold text-red-600 disabled:opacity-30 disabled:bg-slate-100 disabled:text-slate-300 flex items-center justify-center">+</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      updateCartSummary();
    }

    function updateCart(productId, delta) {
      const current = state.cart[productId] || 0;
      const next = current + delta;
      if (next <= 0) delete state.cart[productId];
      else state.cart[productId] = next;
      renderProducts();
    }

    function updateCartSummary() {
      let total = 0;
      let count = 0;
      state.products.forEach(p => {
        const qty = state.cart[p.id] || 0;
        total += p.price * qty;
        count += qty;
      });

      document.getElementById('totalAmount').innerText = total.toLocaleString();
      document.getElementById('submitOrderBtn').disabled = count === 0;
    }

    function openConfirmModal() {
      const list = document.getElementById('confirmDetailList');
      list.innerHTML = '';
      let total = 0;

      state.products.forEach(p => {
        const qty = state.cart[p.id] || 0;
        if (qty > 0) {
          const subtotal = p.price * qty;
          total += subtotal;
          list.innerHTML += `
            <div class="flex justify-between items-center py-2 border-b">
              <div>
                <div class="font-bold text-slate-800">${p.name}</div>
                <div class="text-xs text-slate-400">¥${p.price.toLocaleString()} × ${qty}</div>
              </div>
              <div class="font-bold text-slate-800">¥${subtotal.toLocaleString()}</div>
            </div>
          `;
        }
      });

      document.getElementById('confirmTotalAmount').innerText = total.toLocaleString();
      document.getElementById('modalBackdrop').classList.remove('hidden');
      
      setTimeout(() => {
        document.getElementById('confirmModal').classList.add('active');
      }, 10);
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.remove('active');
      setTimeout(() => {
        document.getElementById('modalBackdrop').classList.add('hidden');
      }, 300);
    }

    async function executeSubmitOrder() {
      showLoading('注文処理を実行中...');
      const btn = document.getElementById('finalSubmitBtn');
      btn.disabled = true;

      const res = await apiPost('submitOrder', { cart: state.cart, sourceDetail: document.getElementById('userInfoText').innerText });
      hideLoading();

      if (res.success) {
        closeConfirmModal();
        state.cart = {};
        showSuccessModal(res.userOrderId, res.signature);
        fetchLatestProducts(); // 全面ローディングを出さずに静かに最新データを読み込む
      } else {
        alert('注文エラー: ' + (res.error || res.message));
      }

      btn.disabled = false;
    }

    function showSuccessModal(userOrderId, signature) {
      document.getElementById('resUserOrderId').innerText = userOrderId;
      const qrArea = document.getElementById('qrcode');
      qrArea.innerHTML = '';
      new QRCode(qrArea, { text: `${userOrderId}_${signature}`, width: 180, height: 180 });

      document.getElementById('successModal').classList.remove('hidden');
      document.getElementById('successModal').classList.add('flex');
    }

    function closeSuccessModal() {
      document.getElementById('successModal').classList.add('hidden');
      document.getElementById('successModal').classList.remove('flex');
    }
  </script>
</body>
</html>
