<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラ・サール学園バザー - 事前注文サイト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

  <!-- ヘッダー -->
  <header class="bg-red-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold">ラ・サール学園バザー</h1>
        <p id="userInfoText" class="text-xs text-red-100">読み込み中...</p>
      </div>
      <button onclick="changeEmail()" class="text-xs bg-red-800 hover:bg-red-900 text-white px-2 py-1 rounded border border-red-400">
        メール変更
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-2xl mx-auto px-4 pt-4">
    <!-- お知らせバナー -->
    <div class="bg-amber-50 border-l-4 border-amber-500 p-3 mb-4 rounded text-xs text-amber-800">
      <p class="font-bold">【ご注文の手順】</p>
      <p>①商品を選んで注文を確定 ➔ ②発行されたQRコードをスクショ ➔ ③レジで提示してお支払い</p>
    </div>

    <!-- 商品一覧 -->
    <div id="productGrid" class="space-y-4">
      <div class="text-center py-8 text-slate-400">商品データを読み込んでいます...</div>
    </div>
  </main>

  <!-- カート固定フッター -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-10">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <span class="text-xs text-slate-500">合計金額</span>
        <div class="text-xl font-bold text-red-600">¥<span id="totalAmount">0</span></div>
      </div>
      <button id="submitOrderBtn" onclick="openConfirmModal()" disabled
        class="bg-red-600 text-white font-bold px-6 py-2.5 rounded-lg disabled:bg-slate-300 transition-colors">
        注文内容を確認する
      </button>
    </div>
  </div>

  <!-- 1. 注文確認モーダル -->
  <div id="confirmModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <h3 class="text-lg font-bold border-b pb-2">注文内容の確認</h3>
      <div id="confirmDetailList" class="space-y-2 text-sm max-h-60 overflow-y-auto"></div>
      <div class="border-t pt-2 flex justify-between font-bold text-base">
        <span>合計金額</span>
        <span class="text-red-600">¥<span id="confirmTotalAmount">0</span></span>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeConfirmModal()" class="w-1/2 py-2 border rounded-lg text-slate-600 font-bold">戻る</button>
        <button id="finalSubmitBtn" onclick="executeSubmitOrder()" class="w-1/2 py-2 bg-red-600 text-white rounded-lg font-bold">注文を確定する</button>
      </div>
    </div>
  </div>

  <!-- 2. 注文完了モーダル (QR表示) -->
  <div id="successModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 text-center space-y-4 shadow-xl">
      <div class="inline-block p-2 bg-green-100 rounded-full text-green-600 font-bold text-2xl">✓</div>
      <h3 class="text-xl font-bold text-slate-800">注文が完了しました！</h3>
      <p class="text-xs text-slate-500">この画面をスクリーンショットして、バザー当日にPOSレジへお持ちください。</p>
      
      <div class="bg-slate-50 p-4 rounded-lg border space-y-2">
        <div class="text-xs text-slate-400">お客様用 注文ID</div>
        <div id="resUserOrderId" class="text-2xl font-black tracking-widest text-red-600">USR00000</div>
        <!-- QRコード描画エリア -->
        <div id="qrcode" class="flex justify-center py-2"></div>
      </div>

      <button onclick="closeSuccessModal()" class="w-full py-2.5 bg-slate-800 text-white rounded-lg font-bold">
        閉じる
      </button>
    </div>
  </div>

  <script>
    // ★★★ GASデプロイ後のウェブアプリURLを貼り付けてください ★★★
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxg_da7psIhzpbH0IHeJSS_iwyjOHxaqw0HxKyYxUJdsHyY8Hr8TuHJudTBne_AhyqQ/exec';

    let state = {
      email: localStorage.getItem('bazaar_email') || '',
      products: [],
      pastQuantities: {},
      cart: {},
      userOrderId: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (!state.email) {
        state.email = prompt('メールアドレスを入力してください:', 'student@lasalle.ed.jp') || 'guest@example.com';
        localStorage.setItem('bazaar_email', state.email);
      }
      initContext();
      setInterval(fetchLatestProducts, 30000); // 30秒自動更新
    });

    function changeEmail() {
      const input = prompt('メールアドレスを入力してください:', state.email);
      if (input) {
        state.email = input.trim().toLowerCase();
        localStorage.setItem('bazaar_email', state.email);
        state.cart = {};
        initContext();
      }
    }

    async function apiPost(action, payload = {}) {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, email: state.email, ...payload })
      });
      return await response.json();
    }

    async function initContext() {
      document.getElementById('userInfoText').innerText = 'データ取得中...';
      try {
        const res = await apiPost('initContext');
        if (res.success) {
          state.products = res.products;
          state.pastQuantities = res.pastQuantities;
          state.userOrderId = res.userOrderId;
          document.getElementById('userInfoText').innerText = res.user.detailText;
          renderProducts();
        } else {
          alert('エラー: ' + res.error);
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
      }
    }

    async function fetchLatestProducts() {
      try {
        const res = await apiPost('fetchProducts');
        if (res.success) {
          state.products = res.products;
          state.pastQuantities = res.pastQuantities;
          renderProducts();
        }
      } catch (e) {}
    }

    function renderProducts() {
      const container = document.getElementById('productGrid');
      container.innerHTML = '';

      state.products.forEach(p => {
        const pastQty = state.pastQuantities[p.id] || 0;
        const currentInCart = state.cart[p.id] || 0;
        const remainingLimit = Math.max(0, p.maxPerUser - pastQty);
        const maxCanAdd = Math.min(p.stock, remainingLimit);

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-sm border p-4 flex gap-4 items-center';

        const imgHtml = p.imageUrl 
          ? `<img src="${p.imageUrl}" class="w-20 h-20 object-cover rounded-lg bg-slate-100 flex-shrink-0">`
          : `<div class="w-20 h-20 bg-slate-100 rounded-lg flex items-center justify-center text-slate-400 text-xs flex-shrink-0">No Image</div>`;

        const isSoldOut = p.stock <= 0;
        const isLimitReached = remainingLimit <= 0;

        card.innerHTML = `
          ${imgHtml}
          <div class="flex-1 min-w-0">
            <h2 class="font-bold text-slate-800 text-base truncate">${p.name}</h2>
            <div class="text-red-600 font-bold text-lg">¥${p.price.toLocaleString()}</div>
            <div class="text-xs text-slate-500 space-y-0.5 mt-1">
              <div>在庫: ${isSoldOut ? '<span class="text-red-500 font-bold">売り切れ</span>' : p.stock + '個'}</div>
              <div>購入上限: 1人${p.maxPerUser}個まで (過去購入: ${pastQty}個)</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateCart('${p.id}', -1)" ${currentInCart <= 0 ? 'disabled' : ''} 
              class="w-8 h-8 rounded-full border bg-slate-50 font-bold text-slate-600 disabled:opacity-30">-</button>
            <span class="w-6 text-center font-bold text-sm">${currentInCart}</span>
            <button onclick="updateCart('${p.id}', 1)" ${currentInCart >= maxCanAdd || isSoldOut || isLimitReached ? 'disabled' : ''} 
              class="w-8 h-8 rounded-full border bg-red-50 font-bold text-red-600 disabled:opacity-30">+</button>
          </div>
        `;
        container.appendChild(card);
      });

      updateCartSummary();
    }

    function updateCart(productId, delta) {
      const current = state.cart[productId] || 0;
      const next = current + delta;
      if (next <= 0) {
        delete state.cart[productId];
      } else {
        state.cart[productId] = next;
      }
      renderProducts();
    }

    function updateCartSummary() {
      let total = 0;
      let count = 0;
      state.products.forEach(p => {
        const qty = state.cart[p.id] || 0;
        total += p.price * qty;
        count += qty;
      });

      document.getElementById('totalAmount').innerText = total.toLocaleString();
      document.getElementById('submitOrderBtn').disabled = count === 0;
    }

    function openConfirmModal() {
      const list = document.getElementById('confirmDetailList');
      list.innerHTML = '';
      let total = 0;

      state.products.forEach(p => {
        const qty = state.cart[p.id] || 0;
        if (qty > 0) {
          const subtotal = p.price * qty;
          total += subtotal;
          list.innerHTML += `
            <div class="flex justify-between items-center py-1 border-b">
              <div>
                <div class="font-bold">${p.name}</div>
                <div class="text-xs text-slate-500">¥${p.price.toLocaleString()} × ${qty}</div>
              </div>
              <div class="font-bold">¥${subtotal.toLocaleString()}</div>
            </div>
          `;
        }
      });

      document.getElementById('confirmTotalAmount').innerText = total.toLocaleString();
      document.getElementById('confirmModal').classList.remove('hidden');
      document.getElementById('confirmModal').classList.add('flex');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.add('hidden');
      document.getElementById('confirmModal').classList.remove('flex');
    }

    async function executeSubmitOrder() {
      const btn = document.getElementById('finalSubmitBtn');
      btn.disabled = true;
      btn.innerText = '送信中...';

      try {
        const res = await apiPost('submitOrder', { cart: state.cart, sourceDetail: document.getElementById('userInfoText').innerText });
        if (res.success) {
          closeConfirmModal();
          state.cart = {};
          showSuccessModal(res.userOrderId, res.signature);
          initContext(); // 最新在庫と購入制限の再ロード
        } else {
          alert('注文失敗: ' + res.error);
        }
      } catch (e) {
        alert('注文処理中に通信エラーが発生しました。');
      } finally {
        btn.disabled = false;
        btn.innerText = '注文を確定する';
      }
    }

    function showSuccessModal(userOrderId, signature) {
      document.getElementById('resUserOrderId').innerText = userOrderId;
      
      const qrArea = document.getElementById('qrcode');
      qrArea.innerHTML = '';
      
      // QRコード値（ユーザー注文ID + 改ざん署名）
      const qrValue = `${userOrderId}_${signature}`;
      new QRCode(qrArea, {
        text: qrValue,
        width: 180,
        height: 180
      });

      document.getElementById('successModal').classList.remove('hidden');
      document.getElementById('successModal').classList.add('flex');
    }

    function closeSuccessModal() {
      document.getElementById('successModal').classList.add('hidden');
      document.getElementById('successModal').classList.remove('flex');
    }
  </script>
</body>
</html>
