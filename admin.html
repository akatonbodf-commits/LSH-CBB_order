<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラ・サール学園バザー - POSレジシステム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- カメラ解析用 lightweight jsQR ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body class="bg-slate-100 h-screen overflow-hidden text-slate-800">

  <div class="flex h-full">

    <!-- 【左カラム】カメラ常時プレビュー ＋ テンキー入力エリア (幅: 320px) -->
    <div class="w-80 bg-white border-r border-slate-200 flex flex-col p-3 shadow-sm overflow-y-auto">
      
      <!-- 常時カメラ映像プレビュー -->
      <div class="mb-3">
        <div class="text-xs font-bold text-slate-500 mb-1 flex justify-between items-center">
          <span>QRコードカメラ</span>
          <span id="cameraStatus" class="text-[10px] text-green-600 font-bold">起動中</span>
        </div>
        <div class="relative w-full h-36 bg-black rounded-lg overflow-hidden border">
          <video id="videoPreview" class="w-full h-full object-cover" playsinline></video>
          <canvas id="qrCanvas" class="hidden"></canvas>
          <div class="absolute inset-0 border-2 border-red-500/50 pointer-events-none flex items-center justify-center">
            <span class="text-[10px] text-white/80 bg-black/40 px-2 py-0.5 rounded">ここにQRをかざす</span>
          </div>
        </div>
      </div>

      <!-- ORD 符号固定入力欄 -->
      <div class="flex items-center border-2 border-red-500 rounded-lg overflow-hidden bg-slate-50 mb-2">
        <span class="bg-red-600 text-white font-black px-2.5 py-2 text-lg">ORD</span>
        <input type="text" id="orderInput" readonly
          class="w-full bg-transparent text-xl font-bold px-2 py-1 text-slate-800 tracking-widest outline-none"
          placeholder="000000">
      </div>

      <!-- 画面テンキー -->
      <div class="grid grid-cols-3 gap-1.5 flex-1 mb-2">
        <button onclick="keypadPress('1')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">1</button>
        <button onclick="keypadPress('2')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">2</button>
        <button onclick="keypadPress('3')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">3</button>
        <button onclick="keypadPress('4')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">4</button>
        <button onclick="keypadPress('5')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">5</button>
        <button onclick="keypadPress('6')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">6</button>
        <button onclick="keypadPress('7')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">7</button>
        <button onclick="keypadPress('8')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">8</button>
        <button onclick="keypadPress('9')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">9</button>
        <button onclick="keypadClear()" class="bg-amber-100 hover:bg-amber-200 font-bold text-xs rounded border text-amber-800">クリア</button>
        <button onclick="keypadPress('0')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">0</button>
        <button onclick="keypadDel()" class="bg-red-100 hover:bg-red-200 font-bold text-xs rounded border text-red-800">Del</button>
      </div>

      <button onclick="executeSearch()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-base rounded-lg shadow">
        検索する
      </button>
    </div>


    <!-- 【中央カラム】照会結果＆明細まとめ表示エリア -->
    <div class="flex-1 flex flex-col p-5 overflow-y-auto">
      
      <!-- 待機時表示 -->
      <div id="emptyView" class="flex-1 flex flex-col items-center justify-center text-slate-400">
        <svg class="w-16 h-16 mb-2 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <p class="text-base font-bold">QRコードをかざすか、注文番号を入力して検索してください</p>
      </div>

      <!-- 照会結果カード -->
      <div id="resultView" class="hidden flex-1 flex-col space-y-3">
        <!-- 顧客情報ヘッダー -->
        <div class="bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center">
          <div>
            <div class="text-xs text-slate-400 font-bold">顧客識別属性</div>
            <div id="resUserDetail" class="text-lg font-bold text-slate-800">---</div>
            <div id="resUserEmail" class="text-xs text-slate-500">---</div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400 font-bold">お客様注文ID (USR)</div>
            <div id="resUserOrderId" class="text-xl font-black text-red-600 tracking-wider">---</div>
          </div>
        </div>

        <!-- 注文明細リスト -->
        <div class="bg-white p-4 rounded-xl border shadow-sm flex-1 flex flex-col">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h3 class="font-bold text-slate-700 text-sm" id="cartSectionTitle">未払い注文一覧（全まとめ）</h3>
            <span id="statusBadge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">未支払い</span>
          </div>

          <div id="resCartList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>

          <div class="border-t pt-3 mt-2 flex justify-between items-end">
            <span class="text-sm font-bold text-slate-500">お支払い合計金額</span>
            <div class="text-3xl font-black text-red-600">¥<span id="resTotalAmount">0</span></div>
          </div>
        </div>
      </div>

    </div>


    <!-- 【右カラム】POS操作ボタンエリア (幅: 300px) -->
    <div class="w-72 bg-white border-l border-slate-200 p-5 flex flex-col justify-between shadow-sm">
      
      <div>
        <h2 class="text-base font-bold text-slate-700 border-b pb-2 mb-3">レジ操作</h2>
        <div class="bg-slate-50 p-3 rounded-xl border space-y-1.5 text-xs text-slate-600">
          <div class="flex justify-between"><span>レジ担当:</span> <span class="font-bold" id="staffEmail">POS-Staff</span></div>
          <div class="flex justify-between"><span>状態:</span> <span class="font-bold text-slate-800" id="posStatusText">待機中</span></div>
        </div>
      </div>

      <!-- 操作ボタン (大1つ、小1つ) -->
      <div class="space-y-3">
        <button id="mainActionButton" disabled onclick="handleMainAction()"
          class="w-full h-32 text-2xl font-black text-white bg-slate-300 rounded-2xl shadow transition-all flex flex-col items-center justify-center gap-1">
          <span>会計確定</span>
          <span class="text-xs font-normal opacity-80">(現金を回収)</span>
        </button>

        <button id="cancelViewButton" onclick="resetPOS()"
          class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl border">
          注文中断 (画面クリア)
        </button>

        <button id="cancelOrderButton" disabled onclick="executeCancelOrder()"
          class="w-full text-xs text-red-500 underline text-center block pt-1">
          この注文全体をキャンセル（在庫返却）
        </button>
      </div>

    </div>

  </div>

  <script>
    // ★★★ GASデプロイ後のウェブアプリURLを貼り付けてください ★★★
    const GAS_API_URL = 'https://script.google.com/macros/s/YOUR_EXEC_URL/exec';
    const STAFF_EMAIL = 'pos-staff@lasalle.ed.jp';

    let currentData = null;
    let videoStream = null;

    document.getElementById('staffEmail').innerText = STAFF_EMAIL;

    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
    });

    // ★ カメラ起動 & QR自動スキャン処理 ★
    async function startCamera() {
      const video = document.getElementById('videoPreview');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        video.setAttribute('playsinline', true);
        video.play();
        requestAnimationFrame(tickScan);
      } catch (err) {
        document.getElementById('cameraStatus').innerText = 'カメラ非対応/拒否';
        document.getElementById('cameraStatus').className = 'text-[10px] text-red-500 font-bold';
      }
    }

    function tickScan() {
      const video = document.getElementById('videoPreview');
      const canvas = document.getElementById('qrCanvas');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert',
        });

        if (code && code.data) {
          let scannedVal = code.data.trim();
          // USRまたはORDを検出した場合自動検索
          if (scannedVal.includes('_')) scannedVal = scannedVal.split('_')[0];
          
          searchByQrValue(scannedVal);
          setTimeout(() => { requestAnimationFrame(tickScan); }, 2000); // 2秒インターバル
          return;
        }
      }
      requestAnimationFrame(tickScan);
    }

    async function searchByQrValue(qrStr) {
      document.getElementById('posStatusText').innerText = 'QR読み取り中...';
      const res = await apiPost('searchOrders', { query: qrStr });
      if (res.success) {
        currentData = res;
        renderSearchResult();
      }
    }

    function keypadPress(val) {
      const input = document.getElementById('orderInput');
      if (input.value.length < 6) input.value += val;
    }

    function keypadDel() {
      const input = document.getElementById('orderInput');
      input.value = input.value.slice(0, -1);
    }

    function keypadClear() {
      document.getElementById('orderInput').value = '';
    }

    async function apiPost(action, payload = {}) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, staffEmail: STAFF_EMAIL, ...payload })
        });
        return await response.json();
      } catch (e) {
        return { success: false, message: '通信エラーが発生しました。' };
      }
    }

    async function executeSearch() {
      const rawVal = document.getElementById('orderInput').value;
      if (!rawVal) return alert('注文番号の数値を入力してください。');

      const query = 'ORD' + rawVal.padStart(6, '0');
      document.getElementById('posStatusText').innerText = '検索中...';
      
      const res = await apiPost('searchOrders', { query });
      if (res.success) {
        currentData = res;
        renderSearchResult();
      } else {
        alert('照会失敗: ' + res.message);
        resetPOS();
      }
    }

    function renderSearchResult() {
      document.getElementById('emptyView').classList.add('hidden');
      document.getElementById('resultView').classList.remove('hidden');
      document.getElementById('resultView').classList.add('flex');

      document.getElementById('resUserDetail').innerText = currentData.userDetail || '一般来場者';
      document.getElementById('resUserEmail').innerText = currentData.clientEmail;
      document.getElementById('resUserOrderId').innerText = currentData.userOrderId;

      const mainBtn = document.getElementById('mainActionButton');
      const badge = document.getElementById('statusBadge');
      const cartList = document.getElementById('resCartList');
      const title = document.getElementById('cartSectionTitle');
      
      cartList.innerHTML = '';
      document.getElementById('cancelOrderButton').disabled = false;

      if (currentData.hasUnpaid) {
        title.innerText = `未払い注文一覧 (${currentData.unpaidOrdersCount}件を合算)`;
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800';
        badge.innerText = '未支払い';

        currentData.unpaidCartList.forEach(item => {
          cartList.innerHTML += `
            <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border text-sm">
              <div>
                <div class="font-bold text-slate-800">${item.name}</div>
                <div class="text-xs text-slate-400">¥${item.price.toLocaleString()} × ${item.qty}</div>
              </div>
              <div class="font-black text-red-600">¥${item.subtotal.toLocaleString()}</div>
            </div>
          `;
        });

        document.getElementById('resTotalAmount').innerText = currentData.unpaidTotalAmount.toLocaleString();
        
        mainBtn.disabled = false;
        mainBtn.className = 'w-full h-32 text-2xl font-black text-white bg-red-600 hover:bg-red-700 rounded-2xl shadow transition-all flex flex-col items-center justify-center gap-1 cursor-pointer';
        mainBtn.innerHTML = `<span>会計確定</span><span class="text-xs font-normal opacity-80">(現金を回収)</span>`;
        document.getElementById('posStatusText').innerText = '会計待ち';

      } else if (currentData.hasPaid) {
        title.innerText = `支払い済み注文一覧 (${currentData.paidOrdersCount}件)`;
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800';
        badge.innerText = '支払い済み (商品未受渡)';

        currentData.paidCartList.forEach(item => {
          cartList.innerHTML += `
            <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border text-sm">
              <div>
                <div class="font-bold text-slate-800">${item.name}</div>
              </div>
              <div class="font-black text-blue-700">× ${item.qty}個</div>
            </div>
          `;
        });

        document.getElementById('resTotalAmount').innerText = '0 (済)';

        mainBtn.disabled = false;
        mainBtn.className = 'w-full h-32 text-2xl font-black text-white bg-blue-600 hover:bg-blue-700 rounded-2xl shadow transition-all flex flex-col items-center justify-center gap-1 cursor-pointer';
        mainBtn.innerHTML = `<span>引換確認</span><span class="text-xs font-normal opacity-80">(商品を渡して完了)</span>`;
        document.getElementById('posStatusText').innerText = '商品受渡待ち';

      } else {
        title.innerText = '処理完了済み';
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-green-100 text-green-800';
        badge.innerText = '引換済み';
        cartList.innerHTML = '<div class="text-center py-8 text-slate-400 font-bold text-sm">全ての商品の引き渡しが完了しています。</div>';
        document.getElementById('resTotalAmount').innerText = '0';

        mainBtn.disabled = true;
        mainBtn.className = 'w-full h-32 text-xl font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';
        mainBtn.innerHTML = `<span>完了済み</span>`;
        document.getElementById('posStatusText').innerText = '完了';
      }
    }

    async function handleMainAction() {
      if (!currentData) return;
      const mainBtn = document.getElementById('mainActionButton');
      mainBtn.disabled = true;

      if (currentData.hasUnpaid) {
        if (!confirm(`¥${currentData.unpaidTotalAmount.toLocaleString()} を受け取りましたか？`)) {
          mainBtn.disabled = false;
          return;
        }

        const res = await apiPost('confirmPayment', { userOrderId: currentData.userOrderId });
        if (res.success) {
          alert('会計が完了しました。続けて商品を渡してください。');
          executeSearch();
        } else {
          alert('決済エラー: ' + res.message);
          mainBtn.disabled = false;
        }

      } else if (currentData.hasPaid) {
        if (!confirm('商品をすべてお客様にお渡ししましたか？')) {
          mainBtn.disabled = false;
          return;
        }

        const res = await apiPost('confirmDelivery', { userOrderId: currentData.userOrderId });
        if (res.success) {
          alert('商品の引き渡しを記録しました。');
          resetPOS();
        } else {
          alert('引換エラー: ' + res.message);
          mainBtn.disabled = false;
        }
      }
    }

    async function executeCancelOrder() {
      if (!currentData) return;
      if (!confirm('この注文をキャンセルし、在庫を戻しますか？')) return;

      const res = await apiPost('cancelOrder', { userOrderId: currentData.userOrderId });
      if (res.success) {
        alert(res.message);
        resetPOS();
      } else {
        alert('キャンセル失敗: ' + res.message);
      }
    }

    function resetPOS() {
      currentData = null;
      keypadClear();
      document.getElementById('emptyView').classList.remove('hidden');
      document.getElementById('resultView').classList.add('hidden');
      document.getElementById('resultView').classList.remove('flex');

      const mainBtn = document.getElementById('mainActionButton');
      mainBtn.disabled = true;
      mainBtn.className = 'w-full h-32 text-xl font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';
      mainBtn.innerHTML = `<span>会計確定</span>`;

      document.getElementById('cancelOrderButton').disabled = true;
      document.getElementById('posStatusText').innerText = '待機中';
    }
  </script>
</body>
</html>
