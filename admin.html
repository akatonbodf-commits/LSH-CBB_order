<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラ・サール学園バザー - POSレジシステム</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen overflow-hidden text-slate-800">

  <!-- 3カラムレイアウト -->
  <div class="flex h-full">

    <!-- 【左カラム】検索＆テンキー入力エリア (幅: 320px) -->
    <div class="w-80 bg-white border-r border-slate-200 flex flex-col p-4 shadow-sm">
      <h2 class="text-base font-bold text-slate-700 border-b pb-2 mb-3">注文ID入力</h2>
      
      <!-- ORD 符号固定入力欄 -->
      <div class="flex items-center border-2 border-red-500 rounded-lg overflow-hidden bg-slate-50 mb-4">
        <span class="bg-red-600 text-white font-black px-3 py-3 text-xl">ORD</span>
        <input type="text" id="orderInput" readonly
          class="w-full bg-transparent text-2xl font-bold px-2 py-2 text-slate-800 tracking-widest outline-none"
          placeholder="000000">
      </div>

      <!-- 画面テンキー (0-9 & Del) -->
      <div class="grid grid-cols-3 gap-2 flex-1 mb-2">
        <button onclick="keypadPress('1')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">1</button>
        <button onclick="keypadPress('2')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">2</button>
        <button onclick="keypadPress('3')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">3</button>
        <button onclick="keypadPress('4')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">4</button>
        <button onclick="keypadPress('5')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">5</button>
        <button onclick="keypadPress('6')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">6</button>
        <button onclick="keypadPress('7')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">7</button>
        <button onclick="keypadPress('8')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">8</button>
        <button onclick="keypadPress('9')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">9</button>
        <button onclick="keypadClear()" class="bg-amber-100 hover:bg-amber-200 font-bold text-sm rounded-lg border text-amber-800">クリア</button>
        <button onclick="keypadPress('0')" class="bg-slate-100 hover:bg-slate-200 font-bold text-2xl rounded-lg border text-slate-700">0</button>
        <button onclick="keypadDel()" class="bg-red-100 hover:bg-red-200 font-bold text-sm rounded-lg border text-red-800">Del</button>
      </div>

      <button onclick="executeSearch()" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold text-lg rounded-lg shadow">
        検索する
      </button>
    </div>


    <!-- 【中央カラム】照会結果＆明細まとめ表示エリア (可変幅) -->
    <div class="flex-1 flex flex-col p-6 overflow-y-auto">
      
      <!-- 待機時表示 -->
      <div id="emptyView" class="flex-1 flex flex-col items-center justify-center text-slate-400">
        <svg class="w-16 h-16 mb-2 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <p class="text-base font-bold">左のテンキーで注文番号を入力して「検索」を押してください</p>
      </div>

      <!-- 照会結果カード -->
      <div id="resultView" class="hidden flex-1 flex-col space-y-4">
        <!-- 顧客情報ヘッダー -->
        <div class="bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center">
          <div>
            <div class="text-xs text-slate-400">顧客識別属性</div>
            <div id="resUserDetail" class="text-lg font-bold text-slate-800">---</div>
            <div id="resUserEmail" class="text-xs text-slate-500">---</div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400">代表注文ID</div>
            <div id="resUserOrderId" class="text-xl font-black text-red-600">---</div>
          </div>
        </div>

        <!-- 注文明細リスト（合算表示） -->
        <div class="bg-white p-5 rounded-xl border shadow-sm flex-1 flex flex-col">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h3 class="font-bold text-slate-700" id="cartSectionTitle">未払い注文一覧（全まとめ）</h3>
            <span id="statusBadge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">未支払い</span>
          </div>

          <!-- 各商品の合計個数リスト -->
          <div id="resCartList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>

          <!-- 合計金額バナー -->
          <div class="border-t pt-4 mt-2 flex justify-between items-end">
            <span class="text-sm font-bold text-slate-500">お支払い合計金額</span>
            <div class="text-3xl font-black text-red-600">¥<span id="resTotalAmount">0</span></div>
          </div>
        </div>
      </div>

    </div>


    <!-- 【右カラム】POS操作アクションボタンエリア (幅: 320px) -->
    <div class="w-80 bg-white border-l border-slate-200 p-6 flex flex-col justify-between shadow-sm">
      
      <!-- ステータス状況要約 -->
      <div>
        <h2 class="text-base font-bold text-slate-700 border-b pb-2 mb-4">レジ操作ステータス</h2>
        <div class="bg-slate-50 p-4 rounded-xl border space-y-2 text-xs text-slate-600">
          <div class="flex justify-between"><span>レジ担当:</span> <span class="font-bold" id="staffEmail">POS-Staff</span></div>
          <div class="flex justify-between"><span>操作状態:</span> <span class="font-bold text-slate-800" id="posStatusText">待機中</span></div>
        </div>
      </div>

      <!-- 操作ボタン構成 (大1つ、小1つ) + キャンセルサブリンク -->
      <div class="space-y-4">
        <!-- 【大きなメインボタン】未払い時:会計確定 ➔ 支払い済み時:引換確認 -->
        <button id="mainActionButton" disabled onclick="handleMainAction()"
          class="w-full h-32 text-2xl font-black text-white bg-slate-300 rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center gap-1">
          <span>会計確定</span>
          <span class="text-xs font-normal opacity-80">(現金お預かり)</span>
        </button>

        <!-- 【小さなサブボタン】注文中断 -->
        <button id="cancelViewButton" onclick="resetPOS()"
          class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl border">
          注文中断 (画面クリア)
        </button>

        <!-- 管理用：注文キャンセル処理 (在庫戻し) -->
        <button id="cancelOrderButton" disabled onclick="executeCancelOrder()"
          class="w-full text-xs text-red-500 underline text-center block pt-2">
          この注文全体をキャンセル（在庫返却）
        </button>
      </div>

    </div>

  </div>

  <script>
    // ★★★ GASデプロイ後のウェブアプリURLを貼り付けてください ★★★
    const GAS_API_URL = 'https://script.google.com/macros/s/YOUR_EXEC_URL/exec';
    const STAFF_EMAIL = 'pos-staff@lasalle.ed.jp';

    let currentData = null; // 現在照会中の注文結果オブジェクト

    document.getElementById('staffEmail').innerText = STAFF_EMAIL;

    function keypadPress(val) {
      const input = document.getElementById('orderInput');
      if (input.value.length < 6) input.value += val;
    }

    function keypadDel() {
      const input = document.getElementById('orderInput');
      input.value = input.value.slice(0, -1);
    }

    function keypadClear() {
      document.getElementById('orderInput').value = '';
    }

    async function apiPost(action, payload = {}) {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, staffEmail: STAFF_EMAIL, ...payload })
      });
      return await response.json();
    }

    async function executeSearch() {
      const rawVal = document.getElementById('orderInput').value;
      if (!rawVal) return alert('注文番号の数値を入力してください。');

      const query = 'ORD' + rawVal.padStart(6, '0');
      
      document.getElementById('posStatusText').innerText = '検索中...';
      try {
        const res = await apiPost('searchOrders', { query });
        if (res.success) {
          currentData = res;
          renderSearchResult();
        } else {
          alert('照会失敗: ' + res.message);
          resetPOS();
        }
      } catch (e) {
        alert('通信エラーが発生しました。');
        resetPOS();
      }
    }

    function renderSearchResult() {
      document.getElementById('emptyView').classList.add('hidden');
      document.getElementById('resultView').classList.remove('hidden');
      document.getElementById('resultView').classList.add('flex');

      document.getElementById('resUserDetail').innerText = currentData.userDetail || '一般来場者';
      document.getElementById('resUserEmail').innerText = currentData.clientEmail;
      document.getElementById('resUserOrderId').innerText = currentData.userOrderId;

      const mainBtn = document.getElementById('mainActionButton');
      const badge = document.getElementById('statusBadge');
      const cartList = document.getElementById('resCartList');
      const title = document.getElementById('cartSectionTitle');
      
      cartList.innerHTML = '';
      document.getElementById('cancelOrderButton').disabled = false;

      // 1. 未払い注文が存在する場合
      if (currentData.hasUnpaid) {
        title.innerText = `未払い注文一覧 (${currentData.unpaidOrdersCount}件の注文を合算)`;
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800';
        badge.innerText = '未支払い';

        currentData.unpaidCartList.forEach(item => {
          cartList.innerHTML += `
            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border">
              <div>
                <div class="font-bold text-slate-800 text-base">${item.name}</div>
                <div class="text-xs text-slate-500">単価: ¥${item.price.toLocaleString()}</div>
              </div>
              <div class="text-right">
                <div class="font-black text-lg text-slate-800">× ${item.qty}</div>
                <div class="font-bold text-xs text-red-600">小計: ¥${item.subtotal.toLocaleString()}</div>
              </div>
            </div>
          `;
        });

        document.getElementById('resTotalAmount').innerText = currentData.unpaidTotalAmount.toLocaleString();
        
        // メインボタン ➔ 「会計確定」
        mainBtn.disabled = false;
        mainBtn.className = 'w-full h-32 text-2xl font-black text-white bg-red-600 hover:bg-red-700 rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center gap-1 cursor-pointer';
        mainBtn.innerHTML = `<span>会計確定</span><span class="text-xs font-normal opacity-80">(現金を回収して完了)</span>`;
        document.getElementById('posStatusText').innerText = '会計待ち';
      
      // 2. 支払い済み（未引換）注文が存在する場合
      } else if (currentData.hasPaid) {
        title.innerText = `支払い済み注文一覧 (${currentData.paidOrdersCount}件の注文)`;
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800';
        badge.innerText = '支払い済み (商品未受渡)';

        currentData.paidCartList.forEach(item => {
          cartList.innerHTML += `
            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border">
              <div>
                <div class="font-bold text-slate-800 text-base">${item.name}</div>
                <div class="text-xs text-slate-500">単価: ¥${item.price.toLocaleString()}</div>
              </div>
              <div class="text-right">
                <div class="font-black text-lg text-blue-700">× ${item.qty}</div>
              </div>
            </div>
          `;
        });

        document.getElementById('resTotalAmount').innerText = '0 (済)';

        // メインボタン ➔ 「引換確認」
        mainBtn.disabled = false;
        mainBtn.className = 'w-full h-32 text-2xl font-black text-white bg-blue-600 hover:bg-blue-700 rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center gap-1 cursor-pointer';
        mainBtn.innerHTML = `<span>引換確認</span><span class="text-xs font-normal opacity-80">(商品を渡して完了)</span>`;
        document.getElementById('posStatusText').innerText = '商品受渡待ち';

      // 3. 全て完了している場合
      } else {
        title.innerText = '処理完了済み';
        badge.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-green-100 text-green-800';
        badge.innerText = '引換済み';
        cartList.innerHTML = '<div class="text-center py-10 text-slate-400 font-bold">全ての商品の受け渡しが完了しています。</div>';
        document.getElementById('resTotalAmount').innerText = '0';

        mainBtn.disabled = true;
        mainBtn.className = 'w-full h-32 text-xl font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';
        mainBtn.innerHTML = `<span>完了済み</span>`;
        document.getElementById('posStatusText').innerText = '完了';
      }
    }

    async function handleMainAction() {
      if (!currentData) return;

      const mainBtn = document.getElementById('mainActionButton');
      mainBtn.disabled = true;

      // 未払い時 ➔ 会計確定API呼び出し
      if (currentData.hasUnpaid) {
        if (!confirm(`¥${currentData.unpaidTotalAmount.toLocaleString()} を受け取りましたか？`)) {
          mainBtn.disabled = false;
          return;
        }

        try {
          const res = await apiPost('confirmPayment', { userOrderId: currentData.userOrderId });
          if (res.success) {
            alert('会計が完了しました。続けて商品の受け渡しを行ってください。');
            // 画面を再照会して引換待ち状態へ遷移
            executeSearch();
          } else {
            alert('決済エラー: ' + res.message);
            mainBtn.disabled = false;
          }
        } catch (e) {
          alert('通信エラーが発生しました。');
          mainBtn.disabled = false;
        }

      // 支払い済み時 ➔ 引換完了API呼び出し
      } else if (currentData.hasPaid) {
        if (!confirm('商品をすべてお客様にお渡ししましたか？')) {
          mainBtn.disabled = false;
          return;
        }

        try {
          const res = await apiPost('confirmDelivery', { userOrderId: currentData.userOrderId });
          if (res.success) {
            alert('商品の引き渡しを記録しました。');
            resetPOS();
          } else {
            alert('引換エラー: ' + res.message);
            mainBtn.disabled = false;
          }
        } catch (e) {
          alert('通信エラーが発生しました。');
          mainBtn.disabled = false;
        }
      }
    }

    async function executeCancelOrder() {
      if (!currentData) return;
      if (!confirm('本当にこの注文をキャンセルしますか？\n（在庫は自動的に返却されます）')) return;

      try {
        const res = await apiPost('cancelOrder', { userOrderId: currentData.userOrderId });
        if (res.success) {
          alert(res.message);
          resetPOS();
        } else {
          alert('キャンセル失敗: ' + res.message);
        }
      } catch (e) {
        alert('通信エラーが発生しました。');
      }
    }

    function resetPOS() {
      currentData = null;
      keypadClear();
      document.getElementById('emptyView').classList.remove('hidden');
      document.getElementById('resultView').classList.add('hidden');
      document.getElementById('resultView').classList.remove('flex');

      const mainBtn = document.getElementById('mainActionButton');
      mainBtn.disabled = true;
      mainBtn.className = 'w-full h-32 text-xl font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';
      mainBtn.innerHTML = `<span>会計確定</span>`;

      document.getElementById('cancelOrderButton').disabled = true;
      document.getElementById('posStatusText').innerText = '待機中';
    }
  </script>
</body>
</html>
