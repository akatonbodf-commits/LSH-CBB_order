<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラ・サール学園バザー - POSレジシステム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- カメラ解析用 lightweight jsQR ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    .loading-overlay {
      display: flex;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #ffffff;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden text-slate-800">

  <!-- ★ 全面ローディング画面 ★ -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p id="loadingText" class="mt-4 font-bold text-base tracking-wider text-slate-100">情報読み込み中...</p>
  </div>

  <div class="flex h-full">

    <!-- 【左カラム】カメラ常時プレビュー（拡大） ＋ テンキー入力エリア (幅: 340px) -->
    <div class="w-85 bg-white border-r border-slate-200 flex flex-col p-3 shadow-sm overflow-y-auto">
      
      <!-- 拡大表示カメラプレビュー -->
      <div class="mb-3">
        <div class="text-xs font-bold text-slate-500 mb-1 flex justify-between items-center">
          <span>QRコードカメラ</span>
          <span id="cameraStatus" class="text-[10px] text-green-600 font-bold">起動中</span>
        </div>
        <!-- 高さを h-56 に拡大 -->
        <div class="relative w-full h-56 bg-black rounded-lg overflow-hidden border shadow-inner">
          <video id="videoPreview" class="w-full h-full object-cover" playsinline></video>
          <canvas id="qrCanvas" class="hidden"></canvas>
          <div class="absolute inset-0 border-2 border-red-500/50 pointer-events-none flex items-center justify-center">
            <span class="text-[10px] text-white/90 bg-black/50 px-2.5 py-1 rounded-full font-bold">ここにQRをかざす</span>
          </div>
        </div>
      </div>

      <!-- ORD 符号固定入力欄 -->
      <div class="flex items-center border-2 border-red-500 rounded-lg overflow-hidden bg-slate-50 mb-2">
        <span class="bg-red-600 text-white font-black px-2.5 py-2 text-lg">ORD</span>
        <input type="text" id="orderInput" readonly
          class="w-full bg-transparent text-xl font-bold px-2 py-1 text-slate-800 tracking-widest outline-none"
          placeholder="000000">
      </div>

      <!-- 画面テンキー -->
      <div class="grid grid-cols-3 gap-1.5 flex-1 mb-2">
        <button onclick="keypadPress('1')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">1</button>
        <button onclick="keypadPress('2')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">2</button>
        <button onclick="keypadPress('3')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">3</button>
        <button onclick="keypadPress('4')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">4</button>
        <button onclick="keypadPress('5')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">5</button>
        <button onclick="keypadPress('6')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">6</button>
        <button onclick="keypadPress('7')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">7</button>
        <button onclick="keypadPress('8')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">8</button>
        <button onclick="keypadPress('9')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">9</button>
        <button onclick="keypadClear()" class="bg-amber-100 hover:bg-amber-200 font-bold text-xs rounded border text-amber-800">クリア</button>
        <button onclick="keypadPress('0')" class="bg-slate-100 hover:bg-slate-200 font-bold text-xl py-2 rounded border text-slate-700">0</button>
        <button onclick="keypadDel()" class="bg-red-100 hover:bg-red-200 font-bold text-xs rounded border text-red-800">Del</button>
      </div>

      <button onclick="executeSearch()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-base rounded-lg shadow">
        検索する
      </button>
    </div>


    <!-- 【中央カラム】上下分割（未払い注文 ＆ 支払い済み注文） -->
    <div class="flex-1 flex flex-col p-4 overflow-y-auto space-y-3">
      
      <!-- 顧客識別ヘッダー -->
      <div id="userInfoHeader" class="bg-white p-3 rounded-xl border shadow-sm flex justify-between items-center">
        <div>
          <div class="text-[10px] text-slate-400 font-bold">顧客識別属性</div>
          <div id="resUserDetail" class="text-base font-bold text-slate-800">---</div>
          <div id="resUserEmail" class="text-xs text-slate-500">---</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-400 font-bold">お客様注文ID (USR)</div>
          <div id="resUserOrderId" class="text-lg font-black text-red-600 tracking-wider">---</div>
        </div>
      </div>

      <!-- 待機時初期表示 -->
      <div id="emptyView" class="flex-1 flex flex-col items-center justify-center text-slate-400 bg-white rounded-xl border border-dashed">
        <svg class="w-16 h-16 mb-2 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <p class="text-base font-bold">QRコードをかざすか、注文番号を入力して検索してください</p>
      </div>

      <!-- 中央カラム：上段（未払い注文） -->
      <div id="unpaidSection" class="hidden flex-1 bg-white p-3.5 rounded-xl border shadow-sm flex-col justify-between">
        <div class="flex justify-between items-center border-b pb-2 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
            <h3 class="font-bold text-slate-800 text-sm">【未払い】注文明細</h3>
            <span id="unpaidCountBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">0件</span>
          </div>
          <div class="text-right">
            <span class="text-xs font-bold text-slate-400">未払い合計: </span>
            <span class="text-xl font-black text-red-600">¥<span id="resUnpaidAmount">0</span></span>
          </div>
        </div>

        <div id="unpaidCartList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-48"></div>
      </div>

      <!-- 中央カラム：下段（支払い済み注文） -->
      <div id="paidSection" class="hidden flex-1 bg-white p-3.5 rounded-xl border shadow-sm flex-col justify-between">
        <div class="flex justify-between items-center border-b pb-2 mb-2">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span>
            <h3 class="font-bold text-slate-800 text-sm">【支払い済み】引換対象商品</h3>
            <span id="paidCountBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800">0件</span>
          </div>
          <div class="text-right text-xs font-bold text-blue-600">お渡し準備完了</div>
        </div>

        <div id="paidCartList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-48"></div>
      </div>

    </div>


    <!-- 【右カラム】POS操作ボタンエリア（上下対応ボタン） (幅: 300px) -->
    <div class="w-72 bg-white border-l border-slate-200 p-4 flex flex-col justify-between shadow-sm">
      
      <div>
        <div class="flex justify-between items-center border-b pb-2 mb-3">
          <h2 class="text-base font-bold text-slate-700">レジ操作</h2>
          <button onclick="changeStaffEmail()" class="text-[10px] text-blue-600 underline font-bold">スタッフ変更</button>
        </div>
        <div class="bg-slate-50 p-2.5 rounded-xl border space-y-1 text-xs text-slate-600">
          <div class="flex justify-between"><span>担当者:</span> <span class="font-bold text-slate-800" id="staffEmailText">確認中...</span></div>
          <div class="flex justify-between"><span>状態:</span> <span class="font-bold text-slate-800" id="posStatusText">待機中</span></div>
        </div>
      </div>

      <!-- 操作ボタン群（分割に対応） -->
      <div class="space-y-3 my-auto">
        <!-- 上ボタン：会計確認 -->
        <button id="payConfirmButton" disabled onclick="handlePaymentAction()"
          class="w-full h-28 text-xl font-black text-white bg-slate-300 rounded-2xl shadow transition-all flex flex-col items-center justify-center gap-1">
          <span>会計確認</span>
          <span class="text-xs font-normal opacity-80">(現金を回収して支払い済みに変更)</span>
        </button>

        <!-- 下ボタン：引換確認 -->
        <button id="deliveryConfirmButton" disabled onclick="handleDeliveryAction()"
          class="w-full h-28 text-xl font-black text-white bg-slate-300 rounded-2xl shadow transition-all flex flex-col items-center justify-center gap-1">
          <span>引換確認</span>
          <span class="text-xs font-normal opacity-80">(商品を渡して完了)</span>
        </button>
      </div>

      <!-- 下部小さな補助ボタン -->
      <div class="space-y-2 pt-2 border-t">
        <button onclick="resetPOS()"
          class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-lg border">
          注文中断 (画面クリア)
        </button>

        <button id="cancelOrderButton" disabled onclick="executeCancelOrder()"
          class="w-full text-[11px] text-red-500 underline text-center block">
          この注文全体をキャンセル（在庫返却）
        </button>
      </div>

    </div>

  </div>

  <script>
    // ★ WebアプリURLを貼り付けてください ★
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxg_da7psIhzpbH0IHeJSS_iwyjOHxaqw0HxKyYxUJdsHyY8Hr8TuHJudTBne_AhyqQ/exec';

    let currentStaffEmail = localStorage.getItem('bazaar_staff_email') || 'akatonbodf@gmail.com';
    let currentData = null;
    let videoStream = null;
    let isProcessingScan = false;

    window.addEventListener('DOMContentLoaded', () => {
      checkStaffAuth();
      startCamera();
    });

    function showLoading(msg = '情報読み込み中...') {
      document.getElementById('loadingText').innerText = msg;
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    async function checkStaffAuth() {
      const res = await apiPost('checkStaffAuth', { staffEmail: currentStaffEmail });
      if (res.isStaff) {
        document.getElementById('staffEmailText').innerText = `${res.staffName} (${res.role})`;
      } else {
        document.getElementById('staffEmailText').innerText = currentStaffEmail;
      }
    }

    function changeStaffEmail() {
      const input = prompt('レジ担当スタッフのGoogleメールアドレスを入力してください:', currentStaffEmail);
      if (input) {
        currentStaffEmail = input.trim().toLowerCase();
        localStorage.setItem('bazaar_staff_email', currentStaffEmail);
        checkStaffAuth();
      }
    }

    // カメラ起動 & QR自動スキャン処理
    async function startCamera() {
      const video = document.getElementById('videoPreview');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        video.setAttribute('playsinline', true);
        video.play();
        requestAnimationFrame(tickScan);
      } catch (err) {
        document.getElementById('cameraStatus').innerText = 'カメラ非対応/拒否';
        document.getElementById('cameraStatus').className = 'text-[10px] text-red-500 font-bold';
      }
    }

    function tickScan() {
      const video = document.getElementById('videoPreview');
      const canvas = document.getElementById('qrCanvas');
      if (video.readyState === video.HAVE_ENOUGH_DATA && !isProcessingScan) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert',
        });

        if (code && code.data) {
          isProcessingScan = true;
          searchByQrValue(code.data.trim());
          return;
        }
      }
      requestAnimationFrame(tickScan);
    }

    async function searchByQrValue(qrStr) {
      showLoading('QR照会中...');
      document.getElementById('posStatusText').innerText = 'QR読み取り中...';
      const res = await apiPost('searchOrders', { query: qrStr });
      hideLoading();

      if (res.success) {
        currentData = res;
        
        // 注文番号/ID入力欄へ自動フィル
        let fillVal = res.userOrderId.replace('USR', '');
        document.getElementById('orderInput').value = fillVal;

        renderSearchResult();
      } else {
        alert('照会失敗: ' + res.message);
        resetPOS();
      }
      
      setTimeout(() => {
        isProcessingScan = false;
        requestAnimationFrame(tickScan);
      }, 3000);
    }

    function keypadPress(val) {
      const input = document.getElementById('orderInput');
      if (input.value.length < 6) input.value += val;
    }

    function keypadDel() {
      const input = document.getElementById('orderInput');
      input.value = input.value.slice(0, -1);
    }

    function keypadClear() {
      document.getElementById('orderInput').value = '';
    }

    async function apiPost(action, payload = {}) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, staffEmail: currentStaffEmail, ...payload })
        });
        return await response.json();
      } catch (e) {
        return { success: false, message: '通信エラーが発生しました。' };
      }
    }

    async function executeSearch() {
      const rawVal = document.getElementById('orderInput').value;
      if (!rawVal) return alert('注文番号の数値を入力してください。');

      const query = rawVal.startsWith('USR') || rawVal.startsWith('ORD') ? rawVal : 'ORD' + rawVal.padStart(6, '0');
      showLoading('注文情報を検索中...');
      document.getElementById('posStatusText').innerText = '検索中...';
      
      const res = await apiPost('searchOrders', { query });
      hideLoading();

      if (res.success) {
        currentData = res;
        renderSearchResult();
      } else {
        alert('照会失敗: ' + res.message);
        resetPOS();
      }
    }

    function renderSearchResult() {
      document.getElementById('emptyView').classList.add('hidden');
      document.getElementById('unpaidSection').classList.remove('hidden');
      document.getElementById('unpaidSection').classList.add('flex');
      document.getElementById('paidSection').classList.remove('hidden');
      document.getElementById('paidSection').classList.add('flex');

      document.getElementById('resUserDetail').innerText = currentData.userDetail || '一般来場者';
      document.getElementById('resUserEmail').innerText = currentData.clientEmail;
      document.getElementById('resUserOrderId').innerText = currentData.userOrderId;

      const payBtn = document.getElementById('payConfirmButton');
      const delivBtn = document.getElementById('deliveryConfirmButton');
      const unpaidList = document.getElementById('unpaidCartList');
      const paidList = document.getElementById('paidCartList');
      
      unpaidList.innerHTML = '';
      paidList.innerHTML = '';
      document.getElementById('cancelOrderButton').disabled = false;

      // 未払いセクション描画
      if (currentData.hasUnpaid) {
        document.getElementById('unpaidCountBadge').innerText = `${currentData.unpaidOrdersCount}件`;
        document.getElementById('resUnpaidAmount').innerText = currentData.unpaidTotalAmount.toLocaleString();

        currentData.unpaidCartList.forEach(item => {
          unpaidList.innerHTML += `
            <div class="flex justify-between items-center bg-red-50/50 p-2 rounded-lg border border-red-100 text-xs">
              <div>
                <div class="font-bold text-slate-800">${item.name}</div>
                <div class="text-[10px] text-slate-400">¥${item.price.toLocaleString()} × ${item.qty}</div>
              </div>
              <div class="font-black text-red-600">¥${item.subtotal.toLocaleString()}</div>
            </div>
          `;
        });

        payBtn.disabled = false;
        payBtn.className = 'w-full h-28 text-xl font-black text-white bg-red-600 hover:bg-red-700 rounded-2xl shadow transition-all flex flex-col items-center justify-center gap-1 cursor-pointer';
      } else {
        document.getElementById('unpaidCountBadge').innerText = '0件';
        document.getElementById('resUnpaidAmount').innerText = '0';
        unpaidList.innerHTML = '<div class="text-center py-4 text-slate-300 font-bold text-xs">未払いの商品はありません</div>';
        
        payBtn.disabled = true;
        payBtn.className = 'w-full h-28 text-base font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';
      }

      // 支払い済みセクション描画
      if (currentData.hasPaid) {
        document.getElementById('paidCountBadge').innerText = `${currentData.paidOrdersCount}件`;

        currentData.paidCartList.forEach(item => {
          paidList.innerHTML += `
            <div class="flex justify-between items-center bg-blue-50/50 p-2 rounded-lg border border-blue-100 text-xs">
              <div>
                <div class="font-bold text-slate-800">${item.name}</div>
              </div>
              <div class="font-black text-blue-700">× ${item.qty}個</div>
            </div>
          `;
        });

        delivBtn.disabled = false;
        delivBtn.className = 'w-full h-28 text-xl font-black text-white bg-blue-600 hover:bg-blue-700 rounded-2xl shadow transition-all flex flex-col items-center justify-center gap-1 cursor-pointer';
      } else {
        document.getElementById('paidCountBadge').innerText = '0件';
        paidList.innerHTML = '<div class="text-center py-4 text-slate-300 font-bold text-xs">引き渡し待ちの商品はありません</div>';
        
        delivBtn.disabled = true;
        delivBtn.className = 'w-full h-28 text-base font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';
      }

      // ステータス更新
      if (currentData.hasUnpaid) {
        document.getElementById('posStatusText').innerText = '会計待ち (未払い有)';
      } else if (currentData.hasPaid) {
        document.getElementById('posStatusText').innerText = '引換待ち (受渡可)';
      } else {
        document.getElementById('posStatusText').innerText = 'すべての処理が完了';
      }
    }

    // 会計確定（現金を回収し未払いを支払い済みに変更）
    async function handlePaymentAction() {
      if (!currentData || !currentData.hasUnpaid) return;

      if (!confirm(`¥${currentData.unpaidTotalAmount.toLocaleString()} を受け取りましたか？`)) return;

      showLoading('会計処理中...');
      const res = await apiPost('confirmPayment', { userOrderId: currentData.userOrderId });
      hideLoading();

      if (res.success) {
        alert('会計が完了しました。「引換確認」に自動更新されます。');
        // 会計確定後、自動的に再検索して「引換確認」状態へ移行
        searchByQrValue(currentData.userOrderId);
      } else {
        alert('決済エラー: ' + res.message);
      }
    }

    // 引換確認（商品を渡して完了にする）
    async function handleDeliveryAction() {
      if (!currentData || !currentData.hasPaid) return;

      if (!confirm('商品をすべてお客様にお渡ししましたか？')) return;

      showLoading('商品受渡処理中...');
      const res = await apiPost('confirmDelivery', { userOrderId: currentData.userOrderId });
      hideLoading();

      if (res.success) {
        alert('商品の引き渡しを記録しました。');
        searchByQrValue(currentData.userOrderId);
      } else {
        alert('引換エラー: ' + res.message);
      }
    }

    async function executeCancelOrder() {
      if (!currentData) return;
      if (!confirm('この注文をキャンセルし、在庫を戻しますか？')) return;

      showLoading('注文キャンセル中...');
      const res = await apiPost('cancelOrder', { userOrderId: currentData.userOrderId });
      hideLoading();

      if (res.success) {
        alert(res.message);
        resetPOS();
      } else {
        alert('キャンセル失敗: ' + res.message);
      }
    }

    function resetPOS() {
      currentData = null;
      keypadClear();
      document.getElementById('emptyView').classList.remove('hidden');
      document.getElementById('unpaidSection').classList.add('hidden');
      document.getElementById('unpaidSection').classList.remove('flex');
      document.getElementById('paidSection').classList.add('hidden');
      document.getElementById('paidSection').classList.remove('flex');

      const payBtn = document.getElementById('payConfirmButton');
      payBtn.disabled = true;
      payBtn.className = 'w-full h-28 text-base font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';

      const delivBtn = document.getElementById('deliveryConfirmButton');
      delivBtn.disabled = true;
      delivBtn.className = 'w-full h-28 text-base font-bold text-slate-400 bg-slate-200 rounded-2xl flex items-center justify-center';

      document.getElementById('cancelOrderButton').disabled = true;
      document.getElementById('posStatusText').innerText = '待機中';
    }
  </script>
</body>
</html>
